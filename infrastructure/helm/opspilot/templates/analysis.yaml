{{- if .Values.rollouts.enabled }}
# Abort the canary on a higher 5xx rate or a latency SLO breach.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: opspilot-api-health
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  metrics:
    - name: error-rate
      interval: 30s
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] <= {{ .Values.rollouts.maxErrorRate }}
      provider:
        prometheus:
          address: {{ .Values.rollouts.prometheusUrl }}
          query: |
            sum(rate(http_errors_total{service="opspilot-api",namespace="{{ .Release.Namespace }}"}[1m]))
            / sum(rate(http_requests_total{service="opspilot-api",namespace="{{ .Release.Namespace }}"}[1m]))
    - name: p95-latency
      interval: 30s
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] <= {{ .Values.rollouts.maxP95Seconds }}
      provider:
        prometheus:
          address: {{ .Values.rollouts.prometheusUrl }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="opspilot-api",namespace="{{ .Release.Namespace }}"}[1m])))
{{- end }}
