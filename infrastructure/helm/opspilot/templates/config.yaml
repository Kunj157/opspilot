apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
  labels: {{- include "opspilot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if and .Values.redpanda.enabled (not (hasKey .Values.config "KAFKA_BOOTSTRAP_SERVERS")) }}
  KAFKA_BOOTSTRAP_SERVERS: "opspilot-redpanda:9092"
  {{- end }}
