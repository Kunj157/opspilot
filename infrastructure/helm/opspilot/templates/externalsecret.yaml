{{- if .Values.externalSecrets.enabled }}
# Produces the Secret named by existingSecret from one JSON entry in AWS
# Secrets Manager (every key becomes an environment variable). Without this,
# create that Secret yourself (kubectl, sealed secrets, ...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels: {{- include "opspilot.labels" . | nindent 4 }}
  annotations:
    # Before the migration job and the workloads read it.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStore.kind }}
    name: {{ .Values.externalSecrets.secretStore.name }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.remoteKey is required, e.g. opspilot-production/app" .Values.externalSecrets.remoteKey }}
{{- end }}
