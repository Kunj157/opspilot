# Default deny for ingress; then only the paths OpsPilot needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-default-deny
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-web
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "opspilot.selector" "opspilot-web" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-api
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "opspilot.selector" "opspilot-api" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "opspilot.selector" "opspilot-web" | nindent 14 }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-worker
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "opspilot.selector" "opspilot-worker" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [{ port: 9100 }]
{{- if .Values.devDatabases.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-databases
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [opspilot-postgres, opspilot-redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [opspilot-api, opspilot-worker, opspilot-migrate]
{{- end }}
{{- if .Values.redpanda.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-redpanda
  labels: {{- include "opspilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "opspilot.selector" "opspilot-redpanda" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [opspilot-api, opspilot-worker] }
      ports: [{ port: 9092 }]
{{- end }}
