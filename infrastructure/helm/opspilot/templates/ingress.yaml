{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts must list at least one host when ingress.enabled is true" }}
{{- end }}
# Public entry: the API path goes straight to the API (live updates over SSE
# skip a proxy hop), everything else to the web app. Works with any
# controller; see docs/adr/005 for the ALB setup used on EKS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opspilot
  labels: {{- include "opspilot.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: {{- toYaml .Values.ingress.hosts | nindent 8 }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: opspilot-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opspilot-web
                port: { name: http }
    {{- end }}
{{- end }}
