# Images are pinned by tag; CI writes the tag of each main build into the
# environment values (GitOps).
image:
  api:
    repository: ghcr.io/kunj157/opspilot-api
    tag: dev
  web:
    repository: ghcr.io/kunj157/opspilot-web
    tag: dev
  pullPolicy: IfNotPresent

# Non-secret configuration, passed as environment variables.
config:
  APP_ENV: production
  LOG_LEVEL: info
  JWT_AUDIENCE: opspilot-api
  AGENT_ALLOWED_NAMESPACES: demo
  AUTO_INVESTIGATE: "true"

# A Secret with DATABASE_URL, REDIS_URL, JWT_ISSUER, OIDC_*, LLM_API_KEY, ...
# Created outside the chart (kubectl locally), or by the ExternalSecret below.
existingSecret: opspilot

# Sync existingSecret from AWS Secrets Manager with External Secrets
# Operator (installed by Terraform with the aws-secrets-manager store).
externalSecrets:
  enabled: false
  secretStore:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # The JSON secret holding every key, e.g. opspilot-production/app
  # (Terraform output app_secret_name).
  remoteKey: ""
  refreshInterval: 1h

# IAM roles for service accounts (Terraform output app_role_arns), e.g.
#   api: { annotations: { eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/opspilot-production-app-api } }
serviceAccounts:
  api: { annotations: {} }
  worker: { annotations: {} }

# Public entry point. On EKS: className alb with the annotations below and
# the ACM certificate found from the hosts (docs/adr/005). With an
# in-cluster controller: its class, certManager.enabled, and tls.secretName.
ingress:
  enabled: false
  className: ""
  hosts: []
  apiPath: /api
  annotations: {}
  #  alb.ingress.kubernetes.io/scheme: internet-facing
  #  alb.ingress.kubernetes.io/target-type: ip
  #  alb.ingress.kubernetes.io/group.name: opspilot
  #  alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  #  alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
  tls:
    enabled: true
    # Secret for the certificate; cert-manager fills it when enabled.
    # Leave empty for the ALB (certificate from ACM).
    secretName: ""
  certManager:
    enabled: false
    clusterIssuer: letsencrypt

networkPolicy:
  # Who may reach the web and API pods from outside the namespace: the
  # ingress controller. For ALB IP targets, the VPC CIDR, e.g.
  #   - ipBlock: { cidr: 10.30.0.0/16 }
  ingressPeers:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: ingress-nginx }

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
  env:
    API_URL: http://opspilot-api:8000

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1536Mi }
  # Namespaces the worker may read and remediate (its Role is created there).
  allowedNamespaces: [demo]

# Canary delivery with Argo Rollouts; plain Deployments when disabled.
rollouts:
  enabled: false
  steps: [10, 25, 50]
  pause: 60s
  prometheusUrl: http://prometheus.observability:9090
  maxErrorRate: "0.05"
  maxP95Seconds: "0.5"

# Development only: in-cluster PostgreSQL and Redis instead of managed ones.
devDatabases:
  enabled: false
  postgresPassword: opspilot-dev
