apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: {{ toJson .Values.architectures }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.capacityTypes }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson .Values.instanceFamilies }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      # Replace nodes regularly so they pick up patched AMIs.
      expireAfter: {{ .Values.expireAfter }}
  # Hard ceiling on what Karpenter may launch (cost guard).
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.consolidateAfter }}
    budgets: {{ toJson .Values.disruptionBudgets }}
