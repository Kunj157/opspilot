apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  loki.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100, log_level: warn }
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
      storage:
        filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    limits_config:
      allow_structured_metadata: true
      retention_period: 48h
    distributor:
      otlp_config:
        default_resource_attributes_as_index_labels: [service.name, k8s.namespace.name]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: [-config.file=/etc/loki/loki.yaml, -target=all]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
