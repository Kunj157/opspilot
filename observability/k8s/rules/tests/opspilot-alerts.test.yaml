# promtool test rules observability/k8s/rules/tests/opspilot-alerts.test.yaml
rule_files: [../opspilot-alerts.yaml]
evaluation_interval: 30s

tests:
  - name: API failing 7.5 % of requests burns the availability budget fast
    interval: 30s
    input_series:
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="200"}'
        values: '0+270x40'
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="500"}'
        values: '0+30x40'
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/services",status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: OpsPilotAPIAvailabilityFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: api-availability }
            exp_annotations:
              description: "7.5% of API requests fail (5xx); at this rate the 30-day budget is gone in about 2 days."
              runbook_url: "https://github.com/Kunj157/opspilot/blob/dev/docs/operations/alerts.md#opspilotapiavailabilityfastburn"
              summary: "API availability error budget burning 14x too fast"
      - { eval_time: 10m, alertname: OpsPilotAPIAvailabilitySlowBurn, exp_alerts: [] }

  - name: A healthy API raises nothing
    interval: 30s
    input_series:
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="200"}'
        values: '0+300x40'
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="503"}'
        values: '0+1x40'
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents",le="0.5"}'
        values: '0+300x40'
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents",le="+Inf"}'
        values: '0+301x40'
      - series: 'http_request_duration_seconds_count{service="opspilot-api",method="GET",route="/api/v1/incidents"}'
        values: '0+301x40'
    alert_rule_test:
      - { eval_time: 20m, alertname: OpsPilotAPIAvailabilityFastBurn, exp_alerts: [] }
      - { eval_time: 20m, alertname: OpsPilotAPILatencyFastBurn, exp_alerts: [] }

  - name: Slow API requests raise latency alerts; long-lived SSE streams are ignored
    interval: 30s
    input_series:
      # 80 % of regular requests take 0.5-1 s.
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents",le="0.5"}'
        values: '0+20x40'
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents",le="1"}'
        values: '0+100x40'
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents",le="+Inf"}'
        values: '0+100x40'
      - series: 'http_request_duration_seconds_count{service="opspilot-api",method="GET",route="/api/v1/incidents"}'
        values: '0+100x40'
      # Streams last minutes by design; they would dominate a quantile otherwise.
      - series: 'http_request_duration_seconds_bucket{service="opspilot-api",method="GET",route="/api/v1/incidents/stream",le="+Inf"}'
        values: '0+1000x40'
      - series: 'http_request_duration_seconds_count{service="opspilot-api",method="GET",route="/api/v1/incidents/stream"}'
        values: '0+1000x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: OpsPilotAPILatencyFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: api-latency }
            exp_annotations:
              description: "80% of API requests take longer than 500 ms."
              runbook_url: "https://github.com/Kunj157/opspilot/blob/dev/docs/operations/alerts.md#opspilotapilatencyfastburn"
              summary: "API latency error budget burning 14x too fast"

  - name: Refusing an unapproved remediation pages as a safety breach
    interval: 1m
    input_series:
      - series: 'opspilot_remediation_executions_total{action="rollback_deployment",outcome="failed"}'
        values: '0 0 1 1 1'
      - series: 'opspilot_remediation_executions_total{action="restart_deployment",outcome="succeeded"}'
        values: '0+1x4'
      - series: 'opspilot_remediation_blocked_total{reason="unapproved"}'
        values: '0 0 0 1 1'
      - series: 'opspilot_remediation_blocked_total{reason="expired"}'
        values: '0 1 2 3 4'
    alert_rule_test:
      - eval_time: 4m
        alertname: OpsPilotRemediationWithoutApproval
        exp_alerts:
          - exp_labels: { severity: page, slo: remediation-safety }
            exp_annotations:
              description: "The executor's recheck refused it, but something queued an unapproved action. Investigate before anything else runs."
              runbook_url: "https://github.com/Kunj157/opspilot/blob/dev/docs/operations/alerts.md#opspilotremediationwithoutapproval"
              summary: "A remediation reached the executor without an approval"

  - name: A steady 4 % error rate is a slow burn (ticket), not a fast one
    interval: 5m
    input_series:
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="200"}'
        values: '0+960x100'
      - series: 'http_requests_total{service="opspilot-api",method="GET",route="/api/v1/incidents",status="500"}'
        values: '0+40x100'
    alert_rule_test:
      - { eval_time: 7h, alertname: OpsPilotAPIAvailabilityFastBurn, exp_alerts: [] }
      - eval_time: 7h
        alertname: OpsPilotAPIAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: { severity: ticket, slo: api-availability }
            exp_annotations:
              description: "4% of API requests failed over 6 h."
              runbook_url: "https://github.com/Kunj157/opspilot/blob/dev/docs/operations/alerts.md#opspilotapiavailabilityslowburn"
              summary: "API availability error budget burning 6x too fast"

  - name: Events slower than 60 s burn the event-processing budget
    interval: 1m
    input_series:
      - series: 'opspilot_event_processing_delay_seconds_bucket{consumer="investigations",le="60"}'
        values: '0+7x60'
      - series: 'opspilot_event_processing_delay_seconds_bucket{consumer="investigations",le="+Inf"}'
        values: '0+10x60'
      - series: 'opspilot_event_processing_delay_seconds_count{consumer="investigations"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: OpsPilotEventProcessingBudgetBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: event-processing }
            exp_annotations:
              description: "30% of events took longer than 60 s to process."
              runbook_url: "https://github.com/Kunj157/opspilot/blob/dev/docs/operations/alerts.md#opspiloteventprocessingbudgetburn"
              summary: "Events are not processed within 60 s"

  - name: Events handled within a minute keep the budget intact
    interval: 1m
    input_series:
      - series: 'opspilot_event_processing_delay_seconds_bucket{consumer="investigations",le="60"}'
        values: '0+10x60'
      - series: 'opspilot_event_processing_delay_seconds_count{consumer="investigations"}'
        values: '0+10x60'
    alert_rule_test:
      - { eval_time: 30m, alertname: OpsPilotEventProcessingBudgetBurn, exp_alerts: [] }
