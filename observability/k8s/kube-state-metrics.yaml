# Pod restarts and available replicas (kube_pod_container_status_restarts_total,
# kube_deployment_status_replicas_available).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspilot-kube-state-metrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: opspilot-kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: observability }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args: ["--resources=pods,deployments,replicasets,nodes,namespaces"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: http, port: 8080, targetPort: http }]
