apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
data:
  tempo.yaml: |
    server: { http_listen_port: 3200, log_level: warn }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
    storage:
      trace:
        backend: local
        local: { path: /var/tempo/traces }
        wal: { path: /var/tempo/wal }
    compactor:
      compaction: { block_retention: 48h }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels: { app.kubernetes.io/name: tempo }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tempo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: tempo
          image: grafana/tempo:2.10.8
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: tempo }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http, nodePort: 30200 }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
