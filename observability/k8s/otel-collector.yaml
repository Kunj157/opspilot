# Receives traces over OTLP and tails demo pod logs; sends traces to Tempo
# and logs to Loki. Prometheus scrapes metrics from the pods directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
      file_log:
        include: [/var/log/pods/demo_*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container
          # Demo services log JSON lines; lift trace context and level out of them.
          - type: json_parser
            if: 'body matches "^\\{"'
            parse_to: attributes
            timestamp: { parse_from: attributes.timestamp, layout_type: gotime, layout: "2006-01-02T15:04:05.999999Z07:00" }
            severity: { parse_from: attributes.level }
          - type: trace_parser
            if: 'attributes.trace_id != nil'
            trace_id: { parse_from: attributes.trace_id }
            span_id: { parse_from: attributes.span_id }
          - type: move
            if: 'attributes.message != nil'
            from: attributes.message
            to: body
          - type: move
            if: 'attributes.service != nil'
            from: attributes.service
            to: resource["service.name"]
    processors:
      batch: {}
      memory_limiter: { check_interval: 1s, limit_mib: 200 }
    exporters:
      otlp_grpc/tempo:
        endpoint: tempo:4317
        tls: { insecure: true }
      otlp_http/loki:
        endpoint: http://loki:3100/otlp
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      telemetry:
        logs: { level: warn }
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/tempo] }
        logs: { receivers: [file_log, otlp], processors: [memory_limiter, batch], exporters: [otlp_http/loki] }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector }
    spec:
      serviceAccountName: otel-collector
      terminationGracePeriodSeconds: 20
      # Node pod logs are root:root, 0750 dirs and 0640 files: membership of
      # group 0 is enough to read them without running as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        supplementalGroups: [0]
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: [--config=/conf/config.yaml]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-collector }
        - name: pod-logs
          hostPath: { path: /var/log/pods }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  internalTrafficPolicy: Local
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
