name: images

# On main: build the API/worker and web images, scan them, attach an SBOM,
# sign them keylessly, and push them to GHCR tagged with the commit SHA.
# Only then is the git tag env/development moved to that commit; Argo CD
# tracks the tag, so it never syncs a commit whose images are not there yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Image · ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      # Image references must be lowercase; the owner is Kunj157.
      IMAGE: ghcr.io/kunj157/opspilot-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        # The full commit SHA: Argo CD deploys a commit with the images built from it.
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan (fail on fixable critical and high)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        id: push
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.tag.outputs.tag }}")" >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest the SBOM (keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.image }}.spdx.json" "${{ steps.push.outputs.digest }}"

  promote:
    name: Promote to development
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the env/development tag ref (no commits)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move env/development to this commit (forward only)
        run: |
          if current="$(git rev-parse -q --verify "refs/tags/env/development^{commit}")" \
            && ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
            echo "env/development is at $current, which is not an ancestor of $GITHUB_SHA: not moving it back."
            exit 0
          fi
          git tag -f env/development "$GITHUB_SHA"
          git push -f origin refs/tags/env/development
          echo "env/development -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
