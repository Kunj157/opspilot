# Destroys the temporary `loadtest` environment once its ttl tag has passed.
# The target is fixed in scripts/loadtest-teardown.sh; no input can point it
# at another environment. Until the `loadtest` GitHub environment defines
# LOADTEST_TEARDOWN_ROLE_ARN, runs are a no-op.
name: Load-test teardown

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Destroy even if the ttl has not passed
        type: boolean
        default: false
      dry_run:
        description: Only report what would happen
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: loadtest-teardown
  cancel-in-progress: false

jobs:
  teardown:
    name: Destroy expired load-test environment
    # Only from the default branch, never from a pull request or feature ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: loadtest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_domain: ${{ vars.LOADTEST_DOMAIN }}
      TF_VAR_alert_emails: ${{ vars.LOADTEST_ALERT_EMAILS }}
    steps:
      - name: Check configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.LOADTEST_TEARDOWN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "LOADTEST_TEARDOWN_ROLE_ARN is not set for the loadtest environment; nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LOADTEST_TEARDOWN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: loadtest-teardown
      - if: steps.config.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Destroy if expired
        if: steps.config.outputs.configured == 'true'
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          scripts/loadtest-teardown.sh "${args[@]}"
