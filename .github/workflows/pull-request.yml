name: pull-request

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest tests/unit --cov=opspilot_api --cov-report=term-missing
      - name: Integration tests (Testcontainers)
        run: uv run pytest tests/integration
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opspilot/models
          key: embedding-model-bge-small-en-v1.5
      - name: Agent evals (retrieval, real embedding model)
        run: uv run pytest tests/evals -s

  ml:
    name: ML · lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy opspilot_ml
      - name: Tests (schema, missing values, leakage, determinism, artifacts)
        run: uv run pytest

  terraform:
    name: Terraform · fmt, validate, tflint, checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate every root and module
        run: |
          for dir in bootstrap environments/* modules/*; do
            [ -d "$dir" ] || continue
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
          done
      - name: tflint
        run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov
        run: uvx checkov==3.3.29 -d . --framework terraform --compact --quiet

  demo:
    name: Demo services · lint, types, tests, image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo/services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build image
        run: docker build -t opspilot-demo:ci .

  helm:
    name: Helm · lint and render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint charts
        run: helm lint --strict infrastructure/helm/*/
      - name: Render charts
        run: for chart in infrastructure/helm/*/; do helm template ci "$chart" > /dev/null; done
      - name: Validate OpsPilot manifests against the Kubernetes and Argo schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template ci infrastructure/helm/opspilot --namespace opspilot \
            --set rollouts.enabled=true --set devDatabases.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.34.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @opspilot/web lint
      - name: Type check
        run: |
          pnpm --filter @opspilot/api-client typecheck
          pnpm --filter @opspilot/web typecheck
      - name: Unit tests
        run: pnpm --filter @opspilot/web test
      - name: Build
        run: pnpm --filter @opspilot/web build

  contract:
    name: Contract · API client matches OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make api-client
      - name: Generated client is committed and current
        run: git diff --exit-code -- packages/api-client

  e2e:
    name: E2E · Playwright against real stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [api, web]
    env:
      CI: "1"
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
      REDIS_URL: redis://localhost:6379/0
      JWT_ISSUER: http://localhost:8080/realms/opspilot
      JWT_AUDIENCE: opspilot-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: (cd apps/api && uv sync)
      - run: pnpm exec playwright install --with-deps chromium
      - run: make infra-up
      - name: Keycloak realm smoke test
        run: make keycloak-smoke
      - run: make test-e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: Security · secrets, SAST, dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Semgrep
        run: uvx semgrep scan --config p/default --error --metrics off --exclude node_modules --exclude .venv .
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv export --no-hashes --no-emit-project -q > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: JS dependency audit (runtime)
        run: pnpm audit --prod --audit-level high
